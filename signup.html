<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | CampusConnect</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <a href="index.html" class="logo">
            🎓 CampusConnect
        </a>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="events.html">Events</a>

            <a href="login.html">Login</a>

        </div>

    </nav>

</header>


<main class="auth-page">

    <div class="auth-box">

        <div class="auth-icon">
            ✨
        </div>

        <h1>Create Account</h1>

        <p>
            Join CampusConnect and discover college events.
        </p>


        <form id="signupForm">

            <label>Full Name</label>

            <input
                type="text"
                id="signupName"
                placeholder="Your full name"
                required
            >


            <label>College Email</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="student@college.edu"
                required
            >


            <label>College ID</label>

            <input
                type="text"
                id="signupId"
                placeholder="Enter college ID"
                required
            >


            <label>Department</label>

            <select id="signupDepartment" required>

                <option value="">
                    Select Department
                </option>

                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>MECH</option>
                <option>CIVIL</option>
                <option>BCA</option>
                <option>MBA</option>

            </select>


            <label>Password</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create password"
                required
            >


            <button class="btn full">
                Create Account
            </button>

        </form>


        <p id="signupMessage"></p>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</main>


<script src="auth.js"></script>

</body>
</html>
